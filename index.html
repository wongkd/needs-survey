<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>表里如一 · 客户需求调研</title>
<style>
:root {
  --gold: #AE8555;
  --gold-light: #C9A87C;
  --gold-bg: #F5EDE3;
  --dark: #2F3943;
  --dark-light: #4A5568;
  --bg: #F7F4F0;
  --card: #FFFFFF;
  --border: #E8E3DC;
  --text: #2F3943;
  --text-light: #718096;
  --danger: #E53E3E;
  --success: #38A169;
  --shadow: 0 2px 16px rgba(47, 57, 67, 0.06);
  --shadow-lg: 0 8px 32px rgba(47, 57, 67, 0.10);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* Header */
.header {
  background: linear-gradient(135deg, var(--dark) 0%, #3D4F5F 100%);
  color: #fff;
  padding: 24px 20px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 20px rgba(47,57,67,0.15);
}

.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.header-logo {
  width: 36px; height: 36px;
  background: var(--gold);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}

.header h1 {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.header-sub {
  font-size: 12px;
  opacity: 0.7;
  font-weight: 400;
}

/* Progress */
.progress-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}

.progress-bar {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 2px;
  transition: width 0.5s ease;
}

.progress-text {
  font-size: 12px;
  opacity: 0.8;
  white-space: nowrap;
  min-width: 48px;
  text-align: right;
}

/* Main content */
.main {
  max-width: 640px;
  margin: 0 auto;
  padding: 16px;
  padding-bottom: 100px;
}

/* Section wrapper */
.section-wrap {
  display: none;
}

.section-wrap.active {
  display: block;
  animation: fadeSlideIn 0.4s ease;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Section Card */
.section-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.section-icon {
  font-size: 28px;
  width: 44px; height: 44px;
  background: var(--gold-bg);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.section-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--dark);
}

.section-desc {
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 20px;
  padding-left: 54px;
}

/* Question block */
.q-block {
  margin-bottom: 20px;
}

.q-block:last-child { margin-bottom: 0; }

.q-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--dark);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.q-required {
  color: var(--danger);
  font-size: 12px;
}

/* Option grid */
.opt-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.opt-grid.col3 {
  grid-template-columns: 1fr 1fr 1fr;
}

.opt-grid.col1 {
  grid-template-columns: 1fr;
}

/* Option item */
.opt-item {
  position: relative;
  cursor: pointer;
}

.opt-item input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.opt-label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  color: var(--dark-light);
  transition: var(--transition);
  user-select: none;
}

.opt-item input:checked + .opt-label {
  background: var(--gold-bg);
  border-color: var(--gold);
  color: var(--dark);
  font-weight: 500;
  box-shadow: 0 0 0 2px rgba(174,133,85,0.12);
}

.opt-label:active {
  transform: scale(0.98);
}

.opt-emoji {
  font-size: 18px;
}

/* Style cards */
.style-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.style-card {
  position: relative;
  cursor: pointer;
}

.style-card input { position: absolute; opacity: 0; }

.style-card-inner {
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  transition: var(--transition);
}

.style-card input:checked + .style-card-inner {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(174,133,85,0.2);
}

.style-preview {
  height: 80px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  letter-spacing: 1px;
}

.style-name {
  padding: 8px 10px;
  font-size: 13px;
  font-weight: 500;
  text-align: center;
  color: var(--dark);
  background: #fff;
}

/* Budget slider */
.budget-slider-wrap {
  padding: 0 4px;
}

.budget-input-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.budget-input-row .text-input {
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
  text-align: center;
  max-width: 140px;
}

.budget-slider {
  width: 100%;
  -webkit-appearance: none;
  height: 6px;
  background: linear-gradient(to right, var(--gold-bg), var(--gold));
  border-radius: 3px;
  outline: none;
}

.budget-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 28px; height: 28px;
  background: #fff;
  border: 2px solid var(--gold);
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.budget-value {
  text-align: center;
  margin: 12px 0 8px;
  font-size: 28px;
  font-weight: 700;
  color: var(--gold);
}

.budget-value span { font-size: 14px; font-weight: 400; }

.budget-marks {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-light);
}

/* Follow-up question */
.follow-up {
  margin-top: 10px;
  padding: 14px;
  background: var(--gold-bg);
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--gold);
  display: none;
}

.follow-up.show { display: block; animation: fadeSlideIn 0.3s ease; }

.follow-up .q-label { margin-bottom: 6px; font-size: 13px; }

/* Chips for multi-select */
.chip-wrap {
  display: flex; flex-wrap: wrap; gap: 8px;
}

.chip-item {
  position: relative; cursor: pointer;
}

.chip-item input { position: absolute; opacity: 0; }

.chip-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  font-size: 13px;
  transition: var(--transition);
}

.chip-item input:checked + .chip-label {
  background: var(--gold);
  border-color: var(--gold);
  color: #fff;
  font-weight: 500;
}

/* Navigation */
.nav-buttons {
  display: flex;
  gap: 10px;
  margin-top: 24px;
}

.btn {
  padding: 14px 24px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  letter-spacing: 0.5px;
}

.btn:active { transform: scale(0.97); }

.btn-prev {
  flex: 0 0 auto;
  background: var(--bg);
  color: var(--text-light);
  border: 1.5px solid var(--border);
}

.btn-next {
  flex: 1;
  background: linear-gradient(135deg, var(--dark) 0%, var(--dark-light) 100%);
  color: #fff;
  box-shadow: 0 4px 14px rgba(47,57,67,0.25);
}

.btn-submit {
  flex: 1;
  background: linear-gradient(135deg, var(--gold) 0%, #C9A87C 100%);
  color: #fff;
  box-shadow: 0 4px 14px rgba(174,133,85,0.35);
}

.btn-outline {
  background: transparent;
  border: 1.5px solid var(--gold);
  color: var(--gold);
}

/* Text input */
.text-input {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  color: var(--dark);
  outline: none;
  transition: var(--transition);
  font-family: inherit;
}

.text-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(174,133,85,0.1);
}

/* Section indicator dots */
.section-dots {
  display: flex;
  gap: 6px;
  padding: 0 20px;
  margin-top: -8px;
  position: sticky;
  top: 112px;
  z-index: 50;
  background: var(--bg);
  padding-top: 8px;
  padding-bottom: 4px;
  overflow-x: auto;
}

.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border);
  flex-shrink: 0;
  cursor: pointer;
  transition: var(--transition);
}

.dot.done { background: var(--gold); opacity: 0.5; }
.dot.active { background: var(--gold); width: 24px; border-radius: 4px; }

/* toast */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--dark);
  color: #fff;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.toast.show { opacity: 1; }

/* Responsive */
@media (min-width: 640px) {
  .opt-grid { grid-template-columns: 1fr 1fr 1fr; }
  .style-grid { grid-template-columns: 1fr 1fr 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-logo">🏗️</div>
    <div>
      <h1>表里如一 · 客户需求调研</h1>
      <div class="header-sub">广东表里如一工程有限公司</div>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="progress-text" id="progressText">0/10</div>
  </div>
</div>

<div class="section-dots" id="sectionDots"></div>

<div class="toast" id="toast"></div>

<div class="main" id="main"></div>

// ============ State ============
let currentSection = 0;
let answers = {};

// ============ Init ============
function init() {
  buildDots();
  renderSection(0);
}

function buildDots() {
  const dots = document.getElementById('sectionDots');
  dots.innerHTML = sections.map((s,i) =>
    `<div class="dot" data-idx="${i}" onclick="goToSection(${i})"></div>`
  ).join('');
}

function updateDots() {
  document.querySelectorAll('.dot').forEach((d,i) => {
    d.className = 'dot';
    if (i < currentSection) d.classList.add('done');
    if (i === currentSection) d.classList.add('active');
  });
}

function updateProgress() {
  const pct = Math.round((currentSection / (sections.length - 1)) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${currentSection+1}/${sections.length}`;
}

// ============ Render ============
function renderSection(idx) {
  currentSection = idx;
  const sec = sections[idx];
  const main = document.getElementById('main');

  let html = `<div class="section-wrap active" id="sec-${idx}">
    <div class="section-card">
      <div class="section-header">
        <div class="section-icon">${sec.icon}</div>
        <div class="section-title">${sec.title}</div>
      </div>
      <div class="section-desc">${sec.desc}</div>`;

  sec.questions.forEach((q, qi) => {
    html += renderQuestion(q, qi, idx);
  });

  html += `<div class="nav-buttons">
    ${idx > 0 ? `<button class="btn btn-prev" onclick="goToSection(${idx-1})">← 上一项</button>` : ''}
    ${idx < sections.length - 1
      ? `<button class="btn btn-next" onclick="nextSection()">下一项 →</button>`
      : `<button class="btn btn-submit" onclick="submit()">✓ 生成需求报告</button>`}
  </div></div></div>`;

  main.innerHTML = html;
  restoreAnswers(idx);
  updateDots();
  updateProgress();
  window.scrollTo(0, 0);
}

function renderQuestion(q, qi, secIdx) {
  const val = answers[q.id] || '';
  const requiredTag = q.required ? '<span class="q-required">*必填</span>' : '';

  let html = `<div class="q-block"><div class="q-label">${q.label} ${requiredTag}</div>`;

  if (q.type === 'choice') {
    html += `<div class="opt-grid col1">`;
    q.options.forEach(o => {
      const checked = (val === o.v) ? 'checked' : '';
      html += `<label class="opt-item">
        <input type="radio" name="${q.id}" value="${o.v}" ${checked} onchange="onChange('${q.id}','${o.v}',${secIdx},${qi})">
        <span class="opt-label">${o.l}</span></label>`;
    });
    html += `</div>`;
  }

  else if (q.type === 'multi') {
    html += `<div class="opt-grid col1">`;
    const vals = Array.isArray(val) ? val : [];
    q.options.forEach(o => {
      const checked = vals.includes(o.v) ? 'checked' : '';
      html += `<label class="opt-item">
        <input type="checkbox" value="${o.v}" ${checked} onchange="onMultiChange('${q.id}','${o.v}',this,${secIdx},${qi})">
        <span class="opt-label">${o.l}</span></label>`;
    });
    html += `</div>`;
  }

  else if (q.type === 'style') {
    html += `<div class="style-grid">`;
    const vals = Array.isArray(val) ? val : [];
    q.options.forEach(o => {
      const checked = vals.includes(o.v) ? 'checked' : '';
      html += `<label class="style-card">
        <input type="checkbox" value="${o.v}" ${checked} onchange="onMultiChange('${q.id}','${o.v}',this,${secIdx},${qi})">
        <div class="style-card-inner">
          <div class="style-preview" style="background:linear-gradient(135deg, ${o.color}40, ${o.color}90)">${o.l}</div>
          <div class="style-name">${o.desc || ''}</div>
        </div></label>`;
    });
    html += `</div>`;
  }

  else if (q.type === 'slider') {
    const curVal = val || q.default;
    html += `<div class="budget-slider-wrap">
      <div class="budget-input-row">
        <input type="number" class="text-input" id="input-${q.id}" value="${curVal}" min="${q.min}" max="${q.max}" step="${q.step}"
          oninput="onSliderInput('${q.id}', this.value, '${q.unit}', ${q.min}, ${q.max})">
        <span style="font-size:15px;color:var(--text-light);white-space:nowrap">${q.unit}</span>
      </div>
      <input type="range" class="budget-slider" id="slider-${q.id}" min="${q.min}" max="${q.max}" step="${q.step}" value="${curVal}"
        oninput="onSliderChange('${q.id}', this.value)">
      <div class="budget-marks">${(q.marks||[]).map(m=>`<span>${m}</span>`).join('')}</div></div>`;
  }

  else if (q.type === 'text') {
    html += `<input type="text" class="text-input" id="input-${q.id}" placeholder="${q.placeholder||''}"
      value="${val}" oninput="onTextChange('${q.id}', this.value)">`;
  }

  // Follow-ups
  if (q.followUp) {
    q.followUp.forEach(fu => {
      html += `<div class="follow-up" id="fu-${fu.id}">`;
      html += `<div class="q-label">${fu.label}</div>`;
      if (fu.type === 'multi') {
        const fuVals = Array.isArray(answers[fu.id]) ? answers[fu.id] : [];
        fu.options.forEach(o => {
          const checked = fuVals.includes(o.v) ? 'checked' : '';
          html += `<label class="opt-item" style="display:inline-block;margin:0 6px 6px 0;">
            <input type="checkbox" value="${o.v}" ${checked} onchange="onFuMultiChange('${fu.id}','${o.v}',this)">
            <span class="opt-label" style="font-size:13px;padding:8px 12px;">${o.l}</span></label>`;
        });
      } else if (fu.type === 'choice') {
        fu.options.forEach(o => {
          const checked = (answers[fu.id] === o.v) ? 'checked' : '';
          html += `<label class="opt-item" style="display:inline-block;margin:0 6px 6px 0;">
            <input type="radio" name="${fu.id}" value="${o.v}" ${checked} onchange="onFuChange('${fu.id}','${o.v}')">
            <span class="opt-label" style="font-size:13px;padding:8px 12px;">${o.l}</span></label>`;
        });
      } else if (fu.type === 'text') {
        html += `<input type="text" class="text-input" id="input-${fu.id}" placeholder="${fu.placeholder||''}"
          value="${answers[fu.id]||''}" oninput="onTextChange('${fu.id}', this.value)">`;
      }
      html += `</div>`;
    });
  }

  html += `</div>`;
  return html;
}

// ============ Answer Handlers ============
function onChange(id, value, secIdx, qi) {
  answers[id] = value;
  updateFollowUps(secIdx, qi);
  checkAndShowFollowUps();
}

function onMultiChange(id, value, el, secIdx, qi) {
  if (!Array.isArray(answers[id])) answers[id] = [];
  if (el.checked) {
    if (!answers[id].includes(value)) answers[id].push(value);
  } else {
    answers[id] = answers[id].filter(v => v !== value);
  }
  if (value === 'none' && el.checked) {
    answers[id] = ['none'];
    setTimeout(() => refreshSection(secIdx), 50);
  }
  updateFollowUps(secIdx, qi);
  checkAndShowFollowUps();
}

function onFuChange(id, value) {
  answers[id] = value;
  const sec = sections[currentSection];
  sec.questions.forEach((q, qi) => {
    if (!q.followUp) return;
    if (!q.followUp.some(fu => fu.id === id)) return;
    updateFollowUps(currentSection, qi);
  });
}

function onFuMultiChange(id, value, el) {
  if (!Array.isArray(answers[id])) answers[id] = [];
  if (el.checked) {
    if (!answers[id].includes(value)) answers[id].push(value);
  } else {
    answers[id] = answers[id].filter(v => v !== value);
  }
}

function onSliderChange(id, value) {
  answers[id] = value;
  const inputEl = document.getElementById('input-'+id);
  if (inputEl) inputEl.value = value;
}

function onSliderInput(id, value, unit, min, max) {
  let v = parseInt(value) || 0;
  if (v < min) v = min;
  if (v > max) v = max;
  answers[id] = v;
  const sliderEl = document.getElementById('slider-'+id);
  if (sliderEl) sliderEl.value = v;
  const inputEl = document.getElementById('input-'+id);
  if (inputEl && parseInt(inputEl.value) !== v) inputEl.value = v;
}

function onTextChange(id, value) {
  answers[id] = value;
}

function updateFollowUps(secIdx, qi) {
  const sec = sections[secIdx];
  const q = sec.questions[qi];
  if (!q.followUp) return;

  setTimeout(() => {
    q.followUp.forEach(fu => {
      const el = document.getElementById('fu-'+fu.id);
      if (!el) return;

      let shouldShow = false;
      const val = answers[q.id];

      if (fu.match) {
        if (typeof fu.match === 'string') {
          if (Array.isArray(val)) shouldShow = val.includes(fu.match);
          else shouldShow = (val === fu.match);
        } else if (Array.isArray(fu.match)) {
          if (Array.isArray(val)) shouldShow = val.some(v => fu.match.includes(v));
          else shouldShow = fu.match.includes(val);
        }
      }

      el.classList.toggle('show', shouldShow);
    });
    // 第二轮：处理嵌套依赖（followUp 依赖兄弟 followUp 的值）
    q.followUp.forEach(fu => {
      const el = document.getElementById('fu-'+fu.id);
      if (!el || el.classList.contains('show')) return;
      if (typeof fu.match !== 'string') return;
      const nested = q.followUp.some(sibling =>
        sibling.id !== fu.id && answers[sibling.id] === fu.match
      );
      if (nested) el.classList.toggle('show', true);
    });
  }, 50);
}

function checkAndShowFollowUps() {
  const sec = sections[currentSection];
  sec.questions.forEach((q, qi) => {
    if (!q.followUp) return;
    // 第一轮：基于父问题值的匹配
    q.followUp.forEach(fu => {
      if (!fu.match) return;
      const el = document.getElementById('fu-'+fu.id);
      if (!el) return;
      const val = answers[q.id];
      let shouldShow = false;
      if (typeof fu.match === 'string') {
        if (Array.isArray(val)) shouldShow = val.includes(fu.match);
        else shouldShow = (val === fu.match);
      } else if (Array.isArray(fu.match)) {
        if (Array.isArray(val)) shouldShow = val.some(v => fu.match.includes(v));
        else shouldShow = fu.match.includes(val);
      }
      el.classList.toggle('show', shouldShow);
    });
    // 第二轮：处理嵌套依赖（followUp 依赖兄弟 followUp 的值）
    q.followUp.forEach(fu => {
      const el = document.getElementById('fu-'+fu.id);
      if (!el || el.classList.contains('show')) return;
      if (typeof fu.match !== 'string') return;
      const nested = q.followUp.some(sibling =>
        sibling.id !== fu.id && answers[sibling.id] === fu.match
      );
      if (nested) el.classList.toggle('show', true);
    });
  });
}

function restoreAnswers(idx) {
  setTimeout(() => {
    const sec = sections[idx];
    sec.questions.forEach((q, qi) => {
      updateFollowUps(idx, qi);
    });
  }, 100);
}

// ============ Navigation ============
function goToSection(idx) {
  if (idx <= currentSection || isSectionComplete(idx-1)) {
    renderSection(idx);
  } else {
    showToast('请先完成当前步骤');
  }
}

function nextSection() {
  if (!isSectionComplete(currentSection)) {
    showToast('请填写必填项后再继续');
    return;
  }
  if (currentSection < sections.length - 1) {
    renderSection(currentSection + 1);
  }
}

function refreshSection(idx) {
  const answersCopy = {...answers};
  renderSection(idx);
  answers = answersCopy;
  restoreAnswers(idx);
}

function isSectionComplete(idx) {
  const sec = sections[idx];
  for (const q of sec.questions) {
    if (q.required) {
      const val = answers[q.id];
      if (!val || (typeof val === 'string' && !val.trim()) || (Array.isArray(val) && val.length === 0)) {
        return false;
      }
    }
  }
  return true;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ============ Submit & Report ============
function submit() {
  if (!isSectionComplete(currentSection)) {
    showToast('请填写必填项后再提交');
    return;
  }
  // Store in sessionStorage for report page
  sessionStorage.setItem('survey_answers', JSON.stringify(answers));
  window.location.href = 'report.html';
}

// ============ Start ============
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
